<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__TITLE__ — Matteflux example</title>

  <!-- 1. Preload the hero poster so it paints first (your LCP image). -->
  <link rel="preload" as="image" href="../../posters/__SLUG__-hero-desktop.webp"
        media="(min-width: 768px)" fetchpriority="high">
  <link rel="preload" as="image" href="../../posters/__SLUG__-hero-mobile.webp"
        media="(max-width: 767px)" fetchpriority="high">

  <!-- 2. Matteflux styles -->
  <link rel="stylesheet" href="matteflux.css">

  <!-- Demo page styles only; not needed on your site -->
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; color: #f3efe7; background: #0c0c0b; }
    .content { max-width: 1100px; margin: 0 auto; padding: 24px; }
    .hero-inner { min-height: 100svh; display: grid; place-content: center; text-align: center; gap: 20px; padding: 24px; }
    .hero-inner h1 { margin: 0; font: 400 clamp(44px, 7vw, 104px)/1 Georgia, serif; }
    .hero-inner p { margin: 0 auto; max-width: 34em; font-size: 18px; color: #e3ddd1; }
    main { padding: 120px 0; }
    .footer-inner { min-height: inherit; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding: 48px; box-sizing: border-box; }
    .footer-inner strong { font: 400 clamp(32px, 4vw, 56px)/1.05 Georgia, serif; }
    @media (max-width: 767px) { .footer-inner { flex-direction: column; align-items: flex-start; padding: 32px 24px; } }
  </style>
</head>
<body>

  <!-- ============ HERO ============ -->
  <section class="mf-section mf-section--hero">
    <div class="mf-bg" style="--mf-overlay: 0.2">
      <picture class="mf-bg__poster">
        <source media="(max-width: 767px)" srcset="../../posters/__SLUG__-hero-mobile.webp" type="image/webp">
        <source media="(max-width: 767px)" srcset="../../posters/__SLUG__-hero-mobile.jpg">
        <source srcset="../../posters/__SLUG__-hero-desktop.webp" type="image/webp">
        <img src="../../posters/__SLUG__-hero-desktop.jpg" alt="" fetchpriority="high" decoding="async">
      </picture>
      <video class="mf-bg__video" muted loop playsinline preload="none" aria-hidden="true"
             data-mf-load="eager"
             data-mf-desktop="../../hero/__SLUG__-hero-desktop"
             data-mf-mobile="../../hero/__SLUG__-hero-mobile"></video>
      <div class="mf-bg__overlay"></div>
    </div>

    <div class="hero-inner">
      <h1>Your headline here</h1>
      <p>Anything you put inside the section sits above the video.</p>
    </div>
  </section>

  <main class="content">
    <p>Your page content.</p>
  </main>

  <!-- ============ FOOTER ============ -->
  <footer class="mf-section mf-section--footer">
    <div class="mf-bg" style="--mf-overlay: 0.35">
      <picture class="mf-bg__poster">
        <source media="(max-width: 767px)" srcset="../../posters/__SLUG__-footer-mobile.webp" type="image/webp">
        <source media="(max-width: 767px)" srcset="../../posters/__SLUG__-footer-mobile.jpg">
        <source srcset="../../posters/__SLUG__-footer-desktop.webp" type="image/webp">
        <img src="../../posters/__SLUG__-footer-desktop.jpg" alt="" loading="lazy" decoding="async">
      </picture>
      <video class="mf-bg__video" muted loop playsinline preload="none" aria-hidden="true"
             data-mf-load="lazy"
             data-mf-desktop="../../footer/__SLUG__-footer-desktop"
             data-mf-mobile="../../footer/__SLUG__-footer-mobile"></video>
      <div class="mf-bg__overlay"></div>
    </div>

    <div class="footer-inner">
      <strong>Let’s build something calm.</strong>
      <span>© Your Company</span>
    </div>
  </footer>

  <!-- 3. Matteflux loader, at the end of <body> -->
  <script src="matteflux.js" defer></script>
</body>
</html>
